kind = "mobile"
previewPath = "/"
title = "CodeForge"
description = "A native Android code editor with project file browsing, editing, search, Git, terminal, extensions, and AI assistance."
version = "1.0.0"
id = "artifacts/codeforge"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 23528

[services.development]
run = "pnpm --filter @workspace/codeforge run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/codeforge", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/codeforge", "run", "serve" ]

[services.env]
PORT = "23528"
BASE_PATH = "/"
